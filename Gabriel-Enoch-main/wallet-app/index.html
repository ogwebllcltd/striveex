<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabriel Enoch - Wallet & Financial Services</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <header class="header">
            <div class="header-top">
                <div class="user-info">
                    <img src="https://via.placeholder.com/40" alt="Gabriel Enoch" class="avatar">
                    <div class="user-details">
                        <h1 class="welcome-text">Welcome Back</h1>
                        <h2 class="user-name">Gabriel Enoch</h2>
                        <p class="user-status">Getpack Tier 5</p>
                    </div>
                </div>
                <div class="header-icons">
                    <button class="icon-btn theme-toggle" id="themeToggle">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                    </button>
                    <button class="icon-btn notification-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Balance Card -->
        <section class="balance-section">
            <div class="balance-card">
                <div class="balance-header">
                    <div class="balance-label">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                            <path d="M1 10h22"></path>
                        </svg>
                        <span>Main Balance:</span>
                    </div>
                    <div class="currency-selector">
                        <button class="currency-btn active">NGN</button>
                        <button class="currency-btn">USD</button>
                        <button class="eye-btn" id="eyeBtn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="balance-amount">
                    <span id="balanceAmount">₦500,000.00</span>
                    <span id="balanceAmountHidden" class="hidden">••••••••</span>
                </div>
                <div class="balance-actions">
                    <button class="btn btn-withdraw">Withdraw</button>
                    <button class="btn btn-topup">+ Top Up</button>
                </div>
            </div>
        </section>

        <!-- Quick Services Section -->
        <section class="services-section">
            <div class="section-header">
                <h3>Quick Services</h3>
                <a href="#" class="see-all-link">Post See all</a>
            </div>
            <div class="services-grid">
                <button class="service-item">
                    <div class="service-icon gift-card">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <polyline points="12 1 12 23"></polyline>
                            <path d="M3 6h18v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z"></path>
                            <path d="M6 6h12v4H6z"></path>
                        </svg>
                    </div>
                    <span class="service-name">Gift Card</span>
                </button>
                <button class="service-item">
                    <div class="service-icon esim">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                            <line x1="9" y1="7" x2="15" y2="7"></line>
                            <line x1="9" y1="11" x2="15" y2="11"></line>
                            <line x1="9" y1="15" x2="15" y2="15"></line>
                        </svg>
                    </div>
                    <span class="service-name">eSim</span>
                </button>
                <button class="service-item">
                    <div class="service-icon airtime">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"></path>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                    </div>
                    <span class="service-name">Airtime</span>
                </button>
                <button class="service-item">
                    <div class="service-icon data">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
                            <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
                            <path d="M9 20h6"></path>
                            <path d="M12 17v3"></path>
                        </svg>
                    </div>
                    <span class="service-name">Data</span>
                </button>
                <button class="service-item">
                    <div class="service-icon cable">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                            <path d="M2 17h20"></path>
                            <line x1="6" y1="21" x2="18" y2="21"></line>
                        </svg>
                    </div>
                    <span class="service-name">Cable TV</span>
                </button>
                <button class="service-item">
                    <div class="service-icon electricity">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polyline>
                        </svg>
                    </div>
                    <span class="service-name">Electricity</span>
                </button>
                <button class="service-item">
                    <div class="service-icon buy-number">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.35-4.35"></path>
                        </svg>
                    </div>
                    <span class="service-name">buy-number</span>
                </button>
                <button class="service-item">
                    <div class="service-icon more">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <circle cx="12" cy="12" r="1"></circle>
                            <circle cx="19" cy="12" r="1"></circle>
                            <circle cx="5" cy="12" r="1"></circle>
                        </svg>
                    </div>
                    <span class="service-name">More</span>
                </button>
            </div>
        </section>

        <!-- Daily Gift Cards Rate -->
        <section class="rates-section">
            <h3 class="rates-title">Daily Gift Cards Rate (2026/04/15 01:16:02)</h3>
            
            <div class="rate-card chime-card">
                <div class="rate-card-content">
                    <div class="rate-logo">
                        <div class="logo-placeholder chime-logo">
                            <span>Chime</span>
                        </div>
                    </div>
                    <div class="rate-details">
                        <h4 class="rate-name">Chime</h4>
                        <p class="rate-value">₦238.41/$</p>
                    </div>
                </div>
                <div class="rate-actions">
                    <button class="pin-btn">+ Pin</button>
                    <div class="rate-time">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        <span>30min</span>
                    </div>
                </div>
                <button class="expand-btn" data-card="chime">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
            </div>

            <div class="rate-card razor-card">
                <div class="rate-card-content">
                    <div class="rate-logo">
                        <div class="logo-placeholder razor-logo">
                            <span>RG</span>
                        </div>
                    </div>
                    <div class="rate-details">
                        <h4 class="rate-name">Razer Gold</h4>
                        <p class="rate-value">₦150.68/USD$</p>
                    </div>
                </div>
                <div class="rate-actions">
                    <button class="pin-btn">+ Pin</button>
                    <div class="rate-time">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        <span>3min</span>
                    </div>
                </div>
                <button class="expand-btn" data-card="razor">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
            </div>
        </section>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-page="home">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>Home</span>
        </button>
        <button class="nav-item" data-page="wallet">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                <path d="M1 10h22"></path>
            </svg>
            <span>Wallet</span>
        </button>
        <button class="nav-item" data-page="chat">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <span>Chat</span>
        </button>
        <button class="nav-item" data-page="status">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <rect x="1" y="1" width="22" height="22" rx="2" ry="2"></rect>
                <line x1="6" y1="8" x2="18" y2="8"></line>
                <line x1="6" y1="14" x2="18" y2="14"></line>
                <line x1="6" y1="20" x2="18" y2="20"></line>
            </svg>
            <span>Status</span>
        </button>
        <button class="nav-item" data-page="user">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>User</span>
        </button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
